name: E2E Public Browsing (20 concurrent users)

on:
  # Run manually from GitHub UI with one click
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        # 4 machines x 5 browsers = 20 concurrent sessions
        shard: [1, 2, 3, 4]

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: |
          npx playwright test --project=public \
            --workers=5 \
            --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # After all 4 shards finish, merge reports into one
  merge-reports:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: html-report-shard-*
          path: all-reports/

      - name: Download all test results (videos)
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-shard-*
          path: all-test-results/

      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter=html all-reports/*

      - name: Bundle videos into report
        run: |
          mkdir -p playwright-report/videos
          find all-test-results/ -name "*.webm" -exec cp {} playwright-report/videos/ \;
          echo "Videos found: $(ls playwright-report/videos/ | wc -l)"

      - name: Upload final report (videos + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report-with-videos
          path: playwright-report/
          retention-days: 30

      - name: Upload all videos separately
        uses: actions/upload-artifact@v4
        with:
          name: e2e-all-videos
          path: all-test-results/
          retention-days: 30
